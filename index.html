<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b1026">
<title>UNO Online</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg0:#05070f; --bg1:#0b1026; --bg2:#151c44; --panel:rgba(255,255,255,.07); --panel2:rgba(255,255,255,.12);
  --txt:#f2f5ff; --muted:#9aa5d0; --accent:#ffc72e; --good:#1fc46a; --bad:#ff4d5e; --blue:#2f7bff;
  --cw:clamp(54px,17vw,74px);
  --safe-t:max(env(safe-area-inset-top,0px),var(--tg-content-safe-area-inset-top,0px));
  --safe-b:max(env(safe-area-inset-bottom,0px),var(--tg-safe-area-inset-bottom,0px));
}
@media (max-height:640px){:root{--cw:clamp(44px,14vw,58px)}}
:root{--tcw:var(--cw)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg0);color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;overscroll-behavior:none}
input{-webkit-user-select:text;user-select:text;font:inherit}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
#app{position:relative;margin:0 auto;width:min(100vw,480px);height:100vh;height:100dvh;height:var(--tg-viewport-stable-height,100dvh);
  overflow:hidden;background:radial-gradient(120% 70% at 50% -5%,#1d2766 0%,var(--bg1) 52%,var(--bg0) 100%)}
@media (min-width:600px){
  body{display:flex;align-items:center;justify-content:center;background:#02030a}
  #app{height:min(100dvh,900px);border-radius:28px;box-shadow:0 30px 80px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.06)}
}
#screen{position:absolute;inset:var(--safe-t) 0 0 0;display:flex;flex-direction:column}
.screen{flex:1;min-height:0;display:flex;flex-direction:column;padding:12px 16px calc(var(--safe-b) + 14px);animation:fadeIn .25s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- общие элементы ---------- */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 18px;border-radius:16px;
  font-weight:700;font-size:17px;background:var(--panel2);border:1px solid rgba(255,255,255,.1);transition:transform .12s,filter .12s,opacity .12s}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(180deg,#ffd75a,#ffb300);color:#2a1d00;border-color:#ffe28a;box-shadow:0 6px 18px rgba(255,179,0,.3)}
.btn.blue{background:linear-gradient(180deg,#4a90ff,#1f5fe0);border-color:#7db0ff;box-shadow:0 6px 18px rgba(47,123,255,.3)}
.btn.green{background:linear-gradient(180deg,#2fd47c,#12994f);border-color:#6df0a8}
.btn.red{background:linear-gradient(180deg,#ff6676,#d1243a);border-color:#ff9aa5}
.btn.small{min-height:40px;font-size:14px;border-radius:12px;padding:0 12px}
.btn[disabled]{opacity:.4;pointer-events:none}
.icon-btn{width:40px;height:40px;border-radius:12px;background:var(--panel2);display:flex;align-items:center;justify-content:center;font-size:18px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;background:var(--panel);font-size:12px;color:var(--muted);white-space:nowrap}
.card-panel{background:var(--panel);border:1px solid rgba(255,255,255,.08);border-radius:18px;padding:14px}
.spinner{width:42px;height:42px;border-radius:50%;border:4px solid rgba(255,255,255,.15);border-top-color:var(--accent);animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.center-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:24px}
.big-emoji{font-size:56px}
.title{font-size:22px;font-weight:800}
h3{margin:0 0 8px;font-size:15px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em}

/* ---------- аватары ---------- */
.avatar{position:relative;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;overflow:hidden;flex:none;border:2px solid rgba(255,255,255,.25)}
.avatar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}

/* ---------- главное меню ---------- */
.logo{display:flex;flex-direction:column;align-items:center;margin:4px 0 14px}
.logo-row{display:flex;gap:8px;transform:rotate(-4deg)}
.logo-row span{width:64px;height:86px;border-radius:14px;border:4px solid #fff;display:flex;align-items:center;justify-content:center;
  font-size:46px;font-weight:900;font-style:italic;box-shadow:0 10px 24px rgba(0,0,0,.5);color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.25)}
.logo-row span:nth-child(1){background:linear-gradient(150deg,#ff5a68,#c8102e);transform:rotate(-6deg)}
.logo-row span:nth-child(2){background:linear-gradient(150deg,#ffd75a,#e09a00);transform:translateY(-4px)}
.logo-row span:nth-child(3){background:linear-gradient(150deg,#4a90ff,#1649b8);transform:rotate(6deg)}
.logo small{margin-top:10px;letter-spacing:.5em;font-size:12px;color:var(--muted);font-weight:700}
.profile{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.profile .nm{font-weight:800;font-size:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.menu-btns{display:flex;flex-direction:column;gap:10px;flex:1;justify-content:center}
.menu-btns .btn{min-height:56px;justify-content:flex-start;padding-left:20px}

/* ---------- листы (модальные окна) ---------- */
#sheet:empty{display:none}
.backdrop{position:absolute;inset:0;z-index:40;background:rgba(2,4,12,.66);display:flex;align-items:flex-end;animation:fadeBg .2s}
@keyframes fadeBg{from{opacity:0}to{opacity:1}}
.sheet{width:100%;max-height:92%;display:flex;flex-direction:column;background:linear-gradient(180deg,#1a2255,#10173b);
  border-radius:26px 26px 0 0;border:1px solid rgba(255,255,255,.1);border-bottom:0;animation:slideUp .25s cubic-bezier(.2,.8,.2,1)}
@keyframes slideUp{from{transform:translateY(60px);opacity:.4}to{transform:none;opacity:1}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 8px}
.sheet-title{font-size:20px;font-weight:800}
.sheet-body{overflow-y:auto;padding:8px 18px calc(var(--safe-b) + 18px);display:flex;flex-direction:column;gap:14px}
.field label{display:block;font-size:13px;color:var(--muted);margin:0 0 6px;font-weight:600}
.field input[type=text],.field input[type=password]{width:100%;height:50px;border-radius:14px;border:1px solid rgba(255,255,255,.14);
  background:rgba(0,0,0,.28);color:var(--txt);padding:0 14px;font-size:17px;outline:none}
.field input:focus{border-color:var(--accent)}
.seg{display:flex;gap:6px}
.seg button{flex:1;height:44px;border-radius:12px;background:var(--panel);border:1px solid rgba(255,255,255,.08);font-weight:700}
.seg button.on{background:linear-gradient(180deg,#ffd75a,#ffb300);color:#2a1d00;border-color:#ffe28a}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px}
.toggle .sw{width:52px;height:30px;border-radius:999px;background:rgba(255,255,255,.18);position:relative;transition:background .2s;flex:none}
.toggle .sw::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s}
.toggle.on .sw{background:var(--good)}
.toggle.on .sw::after{transform:translateX(22px)}
.toggle small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.room-item{display:flex;align-items:center;gap:10px;padding:12px;border-radius:14px;background:var(--panel);border:1px solid rgba(255,255,255,.08);text-align:left;width:100%}
.room-item .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:rgba(31,196,106,.2);color:#6df0a8}
.badge.busy{background:rgba(255,199,46,.18);color:#ffd75a}

/* ---------- лобби ---------- */
.lobby-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.lobby-head .t{font-size:20px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.codebox{display:flex;align-items:center;gap:10px;justify-content:space-between}
.code{font-size:36px;font-weight:900;letter-spacing:.18em;color:var(--accent);font-variant-numeric:tabular-nums}
.plist{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:8px;margin:12px 0}
.prow{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:var(--panel);border:1px solid rgba(255,255,255,.07)}
.prow.empty{border-style:dashed;color:var(--muted);justify-content:center;background:transparent;min-height:64px}
.prow .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .sub{font-size:12px;color:var(--muted)}
.prow.off{opacity:.55}

/* ---------- игровое поле ---------- */
.game{flex:1;min-height:0;display:flex;flex-direction:column;position:relative;padding-bottom:calc(var(--safe-b) + 6px)}
.topbar{display:flex;align-items:center;gap:8px;padding:8px 12px 4px}
.topbar .rc{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.15}
.topbar .rn{font-weight:800;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar .rcode{font-size:11px;color:var(--muted);letter-spacing:.12em}
.opps{display:flex;justify-content:center;gap:10px;padding:2px 8px;min-height:92px}
.opp{flex:1;max-width:150px;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative;padding:4px 0}
.ring{--p:0;--rc:var(--good);border-radius:50%;padding:3px;background:conic-gradient(var(--rc) calc(var(--p)*1%),rgba(255,255,255,.12) 0);transition:filter .2s}
.ring.urgent{--rc:var(--bad)}
.opp.turn .ring{filter:drop-shadow(0 0 10px rgba(255,199,46,.9))}
.opp.turn .ring{--rc:var(--accent)}
.opp .nm{font-size:12px;font-weight:700;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.opp .meta{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted)}
.cnt{display:inline-flex;align-items:center;gap:3px;background:rgba(0,0,0,.4);border-radius:999px;padding:1px 8px;font-weight:800;color:#fff;font-size:12px}
.minis{display:flex;height:14px}
.mini{width:10px;height:14px;border-radius:2px;background:linear-gradient(135deg,#ff3d4f,#ff8a3d);border:1px solid #fff;margin-left:-5px}
.mini:first-child{margin-left:0}
.opp.gone{opacity:.5}
.tag{position:absolute;top:0;right:4px;font-size:10px;font-weight:800;padding:2px 6px;border-radius:999px;background:var(--bad);color:#fff}
.tag.uno{background:var(--accent);color:#2a1d00}
.catch-btn{position:absolute;bottom:-6px;z-index:5;padding:6px 12px;border-radius:999px;background:linear-gradient(180deg,#ff6676,#d1243a);
  font-weight:900;font-size:12px;border:2px solid #fff;animation:pulse .6s infinite alternate}
.table{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;gap:clamp(14px,6vw,30px);position:relative}
.table::before{content:"";position:absolute;width:min(86%,330px);aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle,rgba(47,123,255,.16),rgba(47,123,255,0) 68%);pointer-events:none}
.dir{position:absolute;font-size:30px;color:rgba(255,255,255,.2);pointer-events:none;animation:spin 8s linear infinite}
.dir.ccw{animation-direction:reverse}
.deckwrap,.pilewrap{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px}
.deck{position:relative;cursor:pointer}
.deck.can{animation:pulse .8s infinite alternate;filter:drop-shadow(0 0 10px rgba(255,199,46,.8))}
.deck .stackfx{position:absolute;inset:0;border-radius:calc(var(--cw)*.14);background:#10173b;border:2px solid #fff;transform:translate(3px,3px);z-index:-1}
.deck .n{position:absolute;bottom:-20px;left:0;right:0;text-align:center;font-size:11px;color:var(--muted)}
.pile{position:relative}
.pile .ringc{position:absolute;inset:-9px;border-radius:calc(var(--cw)*.24);border:4px solid var(--cc,#fff);box-shadow:0 0 24px var(--cc,#fff),inset 0 0 14px var(--cc,#fff);transition:border-color .3s,box-shadow .3s}
.cname{font-size:12px;font-weight:800;margin-top:12px;padding:2px 10px;border-radius:999px;background:rgba(0,0,0,.4)}
.status{text-align:center;font-size:14px;font-weight:700;min-height:20px;padding:0 12px;margin-bottom:2px}
.status.mine{color:var(--accent)}
.mebar{display:flex;align-items:center;gap:10px;padding:2px 12px}
.mebar .nm{font-weight:800;font-size:14px}
.tbar{flex:1;height:6px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden}
.tbar i{display:block;height:100%;width:calc(var(--p,0)*1%);background:var(--good);border-radius:99px}
.tbar.urgent i{background:var(--bad)}
.actions{display:flex;gap:8px;padding:6px 12px}
.actions .btn{flex:1;min-height:48px;font-size:15px}
.unobtn{flex:0 0 96px!important;background:linear-gradient(180deg,#ff6676,#d1243a)!important;border:2px solid #fff!important;font-weight:900;font-size:20px!important;letter-spacing:.04em}
.unobtn.pulse{animation:pulse .5s infinite alternate}
.hand-scroll{overflow-x:auto;overflow-y:hidden;padding:20px 8px 6px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.hand-scroll::-webkit-scrollbar{display:none}
.hand{display:flex;align-items:flex-end;min-height:calc(var(--cw)*1.5)}
.hand .card{cursor:pointer}
.hand .card.playable{transform:translateY(-8px);box-shadow:0 0 0 2px var(--accent),0 0 16px rgba(255,199,46,.7),0 6px 12px rgba(0,0,0,.5)}
.hand .card.dim{filter:brightness(.5) saturate(.6)}
.hand .card.selected{transform:translateY(-22px) scale(1.06);z-index:5}
.hand .card.newcard{animation:dealIn .45s cubic-bezier(.2,.8,.2,1) both}
.hand .card.shake{animation:shake .3s}
@keyframes dealIn{from{transform:translate(0,-240px) scale(.5) rotate(-12deg);opacity:0}to{transform:none;opacity:1}}
@keyframes shake{25%{translate:-6px 0}75%{translate:6px 0}}
@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.07)}}
@keyframes pop{0%{transform:scale(.4);opacity:0}20%{transform:scale(1.15);opacity:1}80%{transform:scale(1);opacity:1}100%{transform:scale(1.05) translateY(-20px);opacity:0}}
@keyframes flash{0%{opacity:.5}100%{opacity:0}}

/* ---------- карты ---------- */
.card{--c1:#555;--c2:#333;--cc:#333;position:relative;width:var(--cw);height:calc(var(--cw)*1.5);border-radius:calc(var(--cw)*.14);
  background:linear-gradient(150deg,var(--c1),var(--c2));border:calc(var(--cw)*.05) solid #fff;box-shadow:0 4px 10px rgba(0,0,0,.45);
  flex:none;overflow:hidden;color:#fff;font-weight:900;transition:transform .18s,filter .18s,box-shadow .18s}
.card::before{content:"";position:absolute;left:-18%;right:-18%;top:20%;bottom:20%;background:#fff;border-radius:50%;transform:rotate(-28deg)}
.card .center{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--cc);font-size:calc(var(--cw)*.5);font-style:italic;letter-spacing:-.04em}
.card .corner{position:absolute;font-size:calc(var(--cw)*.21);line-height:1;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.card .tl{left:calc(var(--cw)*.07);top:calc(var(--cw)*.05)}
.card .br{right:calc(var(--cw)*.07);bottom:calc(var(--cw)*.05);transform:rotate(180deg)}
.c-R{--c1:#ff5a68;--c2:#c8102e;--cc:#d8182f}
.c-B{--c1:#4a90ff;--c2:#1649b8;--cc:#1f5fe0}
.c-G{--c1:#2fd47c;--c2:#0d8a47;--cc:#12994f}
.c-Y{--c1:#ffd75a;--c2:#e09a00;--cc:#d98f00}
.c-W{--c1:#2a2f45;--c2:#0a0d19}
.c-W::before{background:conic-gradient(#ff3d4f 0 25%,#ffc72e 0 50%,#1fc46a 0 75%,#2f7bff 0)}
.c-W .center{color:#fff;text-shadow:0 2px 5px rgba(0,0,0,.7)}
.card.back{background:radial-gradient(circle at 50% 35%,#2b3568,#0b1030)}
.card.back::before{background:linear-gradient(135deg,#ff3d4f,#ff8a3d)}
.card.back .center{color:#fff;font-size:calc(var(--cw)*.3);text-shadow:0 2px 4px rgba(0,0,0,.5)}
.card.flying{position:fixed;transform-origin:0 0;pointer-events:none}

/* ---------- слой эффектов ---------- */
#fx{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden}
.banner{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);padding:10px 22px;border-radius:20px;font-size:26px;font-weight:900;
  background:rgba(8,12,34,.86);border:3px solid var(--bc,#fff);color:var(--bc,#fff);box-shadow:0 0 30px var(--bc,#fff);animation:pop 1.25s ease forwards;
  white-space:nowrap;max-width:94vw;overflow:hidden;text-overflow:ellipsis}
.flash{position:absolute;inset:0;animation:flash .7s ease forwards}
#toast{position:absolute;top:calc(var(--safe-t) + 8px);left:0;right:0;z-index:80;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.toast{padding:9px 16px;border-radius:14px;background:rgba(10,14,38,.94);border:1px solid rgba(255,255,255,.18);font-size:14px;font-weight:600;
  max-width:92%;text-align:center;animation:fadeIn .2s}
.toast.err{border-color:var(--bad);color:#ffb3bb}
.toast.ok{border-color:var(--good)}
#conn{position:absolute;inset:0;z-index:90;background:rgba(3,5,14,.82);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:30px}
#conn[hidden]{display:none}

/* ---------- итоги раунда ---------- */
.results{position:absolute;inset:0;z-index:30;background:rgba(3,5,14,.84);display:flex;flex-direction:column;padding:16px;animation:fadeBg .3s;overflow-y:auto}
.res-card{background:linear-gradient(180deg,#1a2255,#10173b);border:1px solid rgba(255,255,255,.12);border-radius:24px;padding:16px;display:flex;flex-direction:column;gap:12px}
.crown{font-size:48px;text-align:center;animation:pop2 1s ease}
@keyframes pop2{from{transform:scale(.3) rotate(-20deg)}to{transform:none}}
.res-title{text-align:center;font-size:22px;font-weight:900}
.res-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:var(--panel)}
.res-row.win{background:rgba(255,199,46,.15);border:1px solid rgba(255,199,46,.5)}
.res-row .pts{font-weight:900;color:var(--accent)}
.prog{height:5px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden;margin-top:4px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,#2fd47c,#ffc72e)}

/* ---------- статистика ---------- */
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{padding:12px;border-radius:14px;background:var(--panel);text-align:center}
.stat b{display:block;font-size:26px}
.stat span{font-size:12px;color:var(--muted)}
.lb-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:var(--panel)}
.lb-row.you{background:rgba(255,199,46,.14);border:1px solid rgba(255,199,46,.5)}
.lb-row .rk{width:24px;text-align:center;font-weight:900;color:var(--muted)}
.scroll{flex:1;min-height:0;overflow-y:auto}
.busy .btn,.busy .deck,.busy .card{pointer-events:none}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
body.lite *{animation-duration:.01ms!important}

/* ---------- общие правила для обёрток и широких экранов ---------- */
.side,.menu-left,.lob-l,.lob-r{display:contents}
.deck,.pile{--cw:var(--tcw)}
.backdrop{justify-content:center}
.sheet{max-width:560px}
.res-card{max-width:560px;width:100%;margin:auto}
.btn.dim{opacity:.55}
.offline-note{font-size:12px;text-align:center;margin-top:10px;line-height:1.4}

/* =====================================================================
   ГОРИЗОНТАЛЬНАЯ ВЕРСИЯ (телефон на боку, планшет, компьютер).
   Включается автоматически по ориентации экрана; вертикальная не меняется.
   ===================================================================== */
@media (orientation:landscape){
  :root{--cw:clamp(40px,14vh,68px);--tcw:clamp(46px,17vh,84px)}
  #app{width:min(100vw,1000px)}
  #screen{padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
  .screen{padding:8px 16px calc(var(--safe-b) + 8px)}
  .sheet{max-height:96%;border-radius:22px 22px 0 0}
  .sheet-body{padding-top:4px}
  .results{padding:8px}
  .res-card{padding:8px 14px;gap:4px;border-radius:20px}
  .res-card .btn{min-height:38px;font-size:15px}
  .crown{display:none}
  .res-title{font-size:17px}
  .res-row{padding:3px 8px;gap:8px}
  .res-row .muted{font-size:11px!important}
  .res-row .prog{display:none}
  .res-row .avatar{width:30px!important;height:30px!important;font-size:13px!important}
  .banner{font-size:22px;top:38%}
  .prow{padding:5px 10px}
  .prow .avatar{width:34px!important;height:34px!important;font-size:14px!important}

  /* главное меню: слева логотип и профиль, справа кнопки */
  .menu-screen{display:grid;grid-template-columns:1fr 1.1fr;gap:0 28px;align-items:center;align-content:center}
  .menu-left{display:flex;flex-direction:column;justify-content:center;min-height:0}
  .menu-btns{flex:none;align-self:center}
  .menu-btns .btn{min-height:48px}
  .logo{margin:0 0 10px}
  .logo-row span{width:48px;height:66px;font-size:34px;border-width:3px}
  .logo small{margin-top:6px}
  .profile{margin-bottom:0}

  /* лобби: слева код и приглашение, справа игроки и кнопки */
  .lobby{display:grid;grid-template-columns:1fr 1.15fr;grid-template-rows:minmax(0,1fr);gap:0 24px}
  .lob-l,.lob-r{display:flex;flex-direction:column;min-height:0}
  .lob-l{justify-content:center}
  .lob-r .plist{margin:0 0 10px}
  .code{font-size:30px}

  /* статистика и настройки */
  .stat-grid{grid-template-columns:repeat(4,1fr)}

  /* игровое поле: слева соперники, по центру стол, справа ваши действия, внизу рука */
  .game{display:grid;grid-template-columns:clamp(128px,21%,190px) minmax(0,1fr) clamp(128px,21%,190px);grid-template-rows:auto minmax(0,1fr) auto;
    grid-template-areas:"top top top" "opps table side" "hand hand hand";padding-bottom:calc(var(--safe-b) + 2px)}
  .topbar{grid-area:top;padding:4px 12px 0}
  .opps{grid-area:opps;flex-direction:column;justify-content:center;gap:4px;min-height:0;padding:0 4px 0 12px;overflow:hidden}
  .opp{flex:0 1 auto;max-width:none;display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:8px;row-gap:0;align-items:center;justify-items:start;padding:2px 0}
  .opp .ring{grid-row:1/3}
  .opp .avatar{width:36px!important;height:36px!important;font-size:15px!important}
  .opp .nm{max-width:100%}
  .opp .minis{display:none}
  .opp .tag{top:-2px;right:0}
  .catch-btn{position:static;grid-column:1/3;margin-top:3px}
  .table{grid-area:table;min-height:0}
  .dir{font-size:26px}
  .side{grid-area:side;display:flex;flex-direction:column;justify-content:center;gap:8px;padding:0 12px 0 4px;min-height:0}
  .status{margin:0;padding:0;font-size:13px;min-height:0}
  .mebar{padding:0;flex-wrap:wrap;gap:4px 8px}
  .mebar .tbar{flex:1 1 100%;order:5}
  .mebar #tleft{order:4;margin-left:auto}
  .actions{flex-direction:column;padding:0;gap:6px}
  .actions .btn{flex:none;min-height:42px;font-size:14px}
  .unobtn{flex:none!important;width:100%}
  .hand-scroll{grid-area:hand;padding:14px 8px 2px}
  .deck .n{bottom:-18px}
  .cname{margin-top:10px}
}
/* очень низкий экран (телефон на боку без панелей) */
@media (orientation:landscape) and (max-height:380px){
  .topbar .icon-btn{width:34px;height:34px}

}
/* компьютер в горизонтальном окне: аккуратная «рамка» вместо растяжения на весь экран */
@media (min-width:600px) and (orientation:landscape){
  #app{height:min(100dvh,640px)}
}

/* =====================================================================
   ОБНОВЛЁННОЕ ОФОРМЛЕНИЕ В СТИЛЕ UNO
   ===================================================================== */
#app{background:radial-gradient(90% 50% at 50% -4%,rgba(255,61,79,.34),transparent 62%),radial-gradient(80% 46% at 100% 100%,rgba(47,123,255,.34),transparent 62%),
  radial-gradient(70% 40% at 0% 88%,rgba(31,196,106,.2),transparent 62%),linear-gradient(180deg,#151b48,#070a1c)}
.bgc{position:absolute;bottom:-100px;border-radius:9px;border:2px solid rgba(255,255,255,.55);opacity:.14;pointer-events:none;animation:bgfloat linear infinite}
@keyframes bgfloat{from{transform:translateY(0) rotate(var(--r0))}to{transform:translateY(-115vh) rotate(calc(var(--r0) + 140deg))}}
@media (prefers-reduced-motion:reduce){.bgc{display:none}}
body.lite .bgc,body.lite .cf{display:none}
.screen{animation:scrIn .45s cubic-bezier(.2,.8,.2,1)}
@keyframes scrIn{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}
@keyframes slideIn{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}
@keyframes bob{from{translate:0 0}to{translate:0 -4px}}
@keyframes glowPulse{from{box-shadow:0 0 12px var(--cc,#fff),inset 0 0 8px var(--cc,#fff)}to{box-shadow:0 0 34px var(--cc,#fff),inset 0 0 20px var(--cc,#fff)}}
@keyframes shine{0%{left:-60%}55%,100%{left:130%}}
@keyframes txtGlow{from{text-shadow:0 0 0 transparent}to{text-shadow:0 0 14px var(--accent)}}

/* кнопки: объёмные, с бликом */
.btn{position:relative;overflow:hidden;border:2px solid rgba(255,255,255,.18);box-shadow:0 4px 0 rgba(0,0,0,.35),0 8px 16px rgba(0,0,0,.25);transition:transform .1s,box-shadow .1s,filter .12s}
.btn:active{transform:translateY(3px) scale(.99);box-shadow:0 1px 0 rgba(0,0,0,.35)}
.btn.primary{box-shadow:0 4px 0 #b36b00,0 10px 22px rgba(255,179,0,.35)}
.btn.blue{box-shadow:0 4px 0 #123c93,0 10px 22px rgba(47,123,255,.35)}
.btn.green{box-shadow:0 4px 0 #0a6a34}
.btn.red{box-shadow:0 4px 0 #8f1424}
.btn.primary::after,.btn.blue::after{content:"";position:absolute;top:0;bottom:0;width:36%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.5),transparent);transform:skewX(-20deg);animation:shine 3.4s ease-in-out infinite}
.btn.small{box-shadow:0 3px 0 rgba(0,0,0,.3)}
.icon-btn{border:1px solid rgba(255,255,255,.15);box-shadow:0 3px 0 rgba(0,0,0,.3);transition:transform .1s}
.icon-btn:active{transform:translateY(2px)}
.card-panel,.prow,.room-item,.stat,.lb-row,.res-row{background:linear-gradient(160deg,rgba(255,255,255,.11),rgba(255,255,255,.04));backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.card-panel{border-color:rgba(255,255,255,.14);box-shadow:0 8px 24px rgba(0,0,0,.25)}
.chip{border:1px solid rgba(255,255,255,.1)}

/* главное меню */
.logo-row{filter:drop-shadow(0 12px 18px rgba(0,0,0,.5))}
.logo-row span{animation:bob 2s ease-in-out infinite alternate;position:relative;overflow:hidden;border-color:#fff;font-family:"Arial Black",Impact,system-ui,sans-serif}
.logo-row span::after{content:"";position:absolute;top:-20%;bottom:-20%;width:40%;left:-70%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-18deg);animation:shine 4s ease-in-out infinite}
.logo-row span:nth-child(2){animation-delay:-.7s}.logo-row span:nth-child(2)::after{animation-delay:.5s}
.logo-row span:nth-child(3){animation-delay:-1.4s}.logo-row span:nth-child(3)::after{animation-delay:1s}
.logo small{background:linear-gradient(90deg,#ff5a68,#ffd75a,#2fd47c,#4a90ff);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:900}
.menu-btns>*{animation:slideIn .5s cubic-bezier(.2,.8,.2,1) both}
.menu-btns>:nth-child(1){animation-delay:.08s}.menu-btns>:nth-child(2){animation-delay:.16s}
.menu-btns>:nth-child(3){animation-delay:.24s}.menu-btns>:nth-child(4){animation-delay:.32s}
.profile .avatar{box-shadow:0 0 0 3px var(--accent),0 0 18px rgba(255,199,46,.45)}
.spinner{border-top-color:var(--accent);border-right-color:var(--blue);border-bottom-color:var(--good);box-shadow:0 0 18px rgba(255,199,46,.25)}

/* листы и лобби */
.sheet{background:linear-gradient(180deg,#232c6e,#10173b);box-shadow:0 -10px 40px rgba(0,0,0,.5);animation:slideUp .35s cubic-bezier(.2,.9,.25,1.1)}
.sheet-head::before{content:"";position:absolute;left:50%;top:7px;width:44px;height:4px;margin-left:-22px;border-radius:9px;background:rgba(255,255,255,.25)}
.sheet-head{position:relative}
.code{background:linear-gradient(90deg,#ff5a68,#ffd75a,#2fd47c,#4a90ff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 10px rgba(255,199,46,.35))}
.prow{animation:slideIn .35s cubic-bezier(.2,.8,.2,1) both}
.prow:nth-child(2){animation-delay:.06s}.prow:nth-child(3){animation-delay:.12s}.prow:nth-child(4){animation-delay:.18s}
.seg button.on{box-shadow:0 3px 0 #b36b00}

/* игровое поле: «сукно» с кольцом и свечением */
.game{background:radial-gradient(60% 40% at 50% 46%,rgba(31,196,106,.12),transparent 70%)}
.table::before{width:min(92%,360px);background:radial-gradient(circle,rgba(47,123,255,.26),rgba(255,61,79,.07) 55%,transparent 70%)}
.table::after{content:"";position:absolute;width:min(96%,380px);aspect-ratio:1;border-radius:50%;border:2px dashed rgba(255,255,255,.14);animation:spin 50s linear infinite;pointer-events:none}
.dir{color:rgba(255,255,255,.28);text-shadow:0 0 12px rgba(255,199,46,.5)}
.pile .ringc{animation:glowPulse 1.5s ease-in-out infinite alternate}
.pile .card{box-shadow:0 10px 24px rgba(0,0,0,.6)}
.deck .stackfx{transform:translate(4px,5px)}
.deck:not(.can):hover{transform:translateY(-2px)}
.cname{border:1px solid rgba(255,255,255,.2);background:rgba(0,0,0,.5);letter-spacing:.04em}
.topbar .rn{font-style:italic;letter-spacing:.02em}
.opp .avatar{box-shadow:0 4px 10px rgba(0,0,0,.4)}
.opp.turn .ring{animation:pulse .7s ease-in-out infinite alternate}
.cnt{border:1px solid rgba(255,255,255,.25);box-shadow:0 2px 0 rgba(0,0,0,.3)}
.status{text-shadow:0 2px 6px rgba(0,0,0,.5)}
.status.mine{color:var(--accent);animation:txtGlow .8s ease-in-out infinite alternate}
.tbar{box-shadow:inset 0 1px 3px rgba(0,0,0,.4)}
.tbar i{background:linear-gradient(90deg,#2fd47c,#8cf0b8)}
.tbar.urgent i{background:linear-gradient(90deg,#ff4d5e,#ff9aa5)}
.unobtn{box-shadow:0 4px 0 #8f1424,0 0 22px rgba(255,77,94,.55)!important;font-style:italic;text-shadow:0 2px 0 rgba(0,0,0,.3)}

/* карты */
.card{box-shadow:0 6px 14px rgba(0,0,0,.5),inset 0 0 0 1px rgba(0,0,0,.15)}
.card::after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,rgba(255,255,255,.28),transparent 38%);pointer-events:none}
.card .center{text-shadow:0 2px 0 rgba(0,0,0,.18)}
.hand .card:not(.selected):active{transform:translateY(-10px)}
.hand .card.playable:not(.newcard):not(.selected){animation:bob 1.1s ease-in-out infinite alternate}
.hand .card.selected{box-shadow:0 0 0 3px var(--accent),0 0 26px rgba(255,199,46,.85),0 14px 20px rgba(0,0,0,.5)}

/* баннеры, эффекты */
.banner{font-style:italic;letter-spacing:.02em;text-shadow:0 3px 0 rgba(0,0,0,.45);background:linear-gradient(180deg,rgba(24,30,78,.94),rgba(8,12,34,.94));
  box-shadow:0 0 40px var(--bc,#fff),0 12px 30px rgba(0,0,0,.5),inset 0 0 18px rgba(255,255,255,.08)}
.cf{position:absolute;top:-16px;left:var(--x);width:9px;height:15px;border-radius:2px;background:var(--c);opacity:0;animation:cf var(--d) cubic-bezier(.25,.6,.4,1) forwards}
@keyframes cf{0%{opacity:1;transform:translate3d(0,0,0) rotate(0)}100%{opacity:1;transform:translate3d(var(--dx),108vh,0) rotate(var(--r))}}
.burst{position:absolute;width:24px;height:24px;border-radius:50%;border:4px solid var(--bc);box-shadow:0 0 22px var(--bc),inset 0 0 12px var(--bc);animation:burst .6s ease-out forwards}
@keyframes burst{from{transform:scale(.4);opacity:1}to{transform:scale(6);opacity:0}}
.toast{background:linear-gradient(180deg,rgba(26,32,80,.96),rgba(10,14,38,.96));box-shadow:0 8px 20px rgba(0,0,0,.4);animation:scrIn .3s cubic-bezier(.2,.9,.3,1.2)}

/* итоги раунда */
.res-card{border:2px solid rgba(255,199,46,.4);box-shadow:0 0 50px rgba(255,199,46,.18),0 20px 50px rgba(0,0,0,.5);animation:scrIn .5s cubic-bezier(.2,.9,.3,1.2)}
.crown{animation:crownIn .9s cubic-bezier(.2,.9,.3,1.4),bob 1.4s ease-in-out .9s infinite alternate;filter:drop-shadow(0 0 16px rgba(255,199,46,.7))}
@keyframes crownIn{from{transform:scale(.2) rotate(-30deg);opacity:0}to{transform:none;opacity:1}}
.res-title{background:linear-gradient(90deg,#ff5a68,#ffd75a,#2fd47c,#4a90ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.res-row{animation:slideIn .4s cubic-bezier(.2,.8,.2,1) both}
.res-row:nth-of-type(1){animation-delay:.15s}.res-row:nth-of-type(2){animation-delay:.25s}.res-row:nth-of-type(3){animation-delay:.35s}.res-row:nth-of-type(4){animation-delay:.45s}
.res-row.win{box-shadow:0 0 22px rgba(255,199,46,.3)}
.prog i{transition:width 1s cubic-bezier(.2,.8,.2,1)}

/* ---------- спецэффекты карт ---------- */
.banner{translate:-50% -50%}
#app.ashake{animation:appshake .55s}
@keyframes appshake{10%,50%,90%{transform:translate(-7px,3px)}30%,70%{transform:translate(7px,-3px)}}
.fxbig{position:absolute;left:50%;top:40%;translate:-50% -50%;font:italic 900 min(34vw,170px)/1 "Arial Black",Impact,sans-serif;color:#fff;-webkit-text-stroke:4px var(--bc);paint-order:stroke fill;
  text-shadow:0 0 28px var(--bc),0 0 70px var(--bc),0 8px 0 rgba(0,0,0,.45);animation:slam 1.35s cubic-bezier(.2,.9,.2,1) forwards;white-space:nowrap}
.fxbig.rb{color:transparent;-webkit-text-stroke:0;background:linear-gradient(90deg,#ff3d4f,#ffc72e,#1fc46a,#2f7bff,#ff3d4f);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;text-shadow:none;
  filter:drop-shadow(0 0 18px #fff) drop-shadow(0 7px 0 rgba(0,0,0,.5));animation:slam 1.35s cubic-bezier(.2,.9,.2,1) forwards,rbmove .5s linear infinite}
.fxbig.rev{animation:revspin 1.4s cubic-bezier(.2,.9,.2,1) forwards}
@keyframes slam{0%{transform:scale(3.6) rotate(-14deg);opacity:0}16%{transform:scale(.88) rotate(3deg);opacity:1}26%{transform:scale(1.12) rotate(-2deg)}38%,72%{transform:scale(1);opacity:1}100%{transform:scale(1.6);opacity:0}}
@keyframes revspin{0%{transform:scale(.2) rotate(-400deg);opacity:0}28%{transform:scale(1.15) rotate(0);opacity:1}70%{transform:scale(1) rotate(25deg);opacity:1}100%{transform:scale(1.7) rotate(200deg);opacity:0}}
@keyframes rbmove{to{background-position:-200% 0}}
.fxsub{position:absolute;left:50%;top:calc(40% + min(20vw,100px));translate:-50% 0;padding:6px 18px;border-radius:999px;background:rgba(8,12,34,.88);border:2px solid var(--bc);color:var(--bc);
  font-weight:900;font-size:18px;white-space:nowrap;box-shadow:0 0 22px var(--bc);animation:pop 1.4s ease forwards}
.shockw{position:absolute;width:40px;height:40px;border-radius:50%;border:6px solid var(--bc);box-shadow:0 0 26px var(--bc),inset 0 0 18px var(--bc);animation:shockw .95s ease-out forwards}
@keyframes shockw{from{transform:scale(.2);opacity:1}to{transform:scale(14);opacity:0}}
.spark{position:absolute;width:9px;height:9px;border-radius:50%;background:var(--c);box-shadow:0 0 12px var(--c);animation:spark .95s ease-out forwards}
@keyframes spark{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
.sweep{position:absolute;left:0;right:0;top:calc(40% - 42px);height:84px;display:flex;align-items:center;justify-content:center;font-size:60px;font-weight:900;letter-spacing:.2em;color:#fff;
  background:linear-gradient(90deg,transparent,rgba(74,144,255,.7),transparent);text-shadow:0 0 22px #4a90ff;animation:sweepR .95s ease-out forwards}
.sweep.ccw{animation-name:sweepL}
@keyframes sweepR{from{transform:translateX(-100%);opacity:0}30%{opacity:1}to{transform:translateX(100%);opacity:0}}
@keyframes sweepL{from{transform:translateX(100%);opacity:0}30%{opacity:1}to{transform:translateX(-100%);opacity:0}}
body.lite .fxbig,body.lite .sweep{display:none}

    if (!p || this.status !== 'playing') throw new LErr('uno_not_allowed', 'Сейчас нельзя объявить UNO');
    const n = p.hand.length, isTurn = this.cur().id === pid;
    if (!(n === 1 || (n === 2 && isTurn))) throw new LErr('uno_not_allowed', 'UNO можно объявить, когда осталась одна карта (или две — перед ходом)');
    p.uno_called = true;
    if (this.uno && this.uno.pid === pid) this.uno = null;
    this.ev('uno', { pid });
  }
  catchUno(by, target, now) {
    const w = this.uno;
    if (this.status !== 'playing' || !w || now > w.until) throw new LErr('nothing_to_catch', 'Поймать некого: время вышло');
    target = target || w.pid;
    const t = this.get(target);
    if (!t || target !== w.pid || by === target) throw new LErr('nothing_to_catch', 'Поймать некого');
    if (t.hand.length !== 1 || t.uno_called) throw new LErr('nothing_to_catch', 'Игрок уже объявил UNO');
    this.uno = null;
    const cnt = this.give(t, 6);
    this.ev('caught', { pid: by, target }); this.ev('penalty', { pid: target, count: cnt });
  }
  timeoutAction(now) {
    const p = this.cur();
    this.ev('timeout', { pid: p.id });
    if (this.drawn === null) this.draw(p.id, now);
    if (this.status === 'playing' && this.cur() === p && this.drawn !== null) this.pass(p.id, now);
  }

  botMove(now) {
    const p = this.cur(), diff = p.difficulty || 'normal';
    const ids = new Set(this.playableIds(p.id));
    const cards = p.hand.filter(c => ids.has(c.id));
    if (!cards.length) { if (this.drawn === null) this.draw(p.id, now); else this.pass(p.id, now); return; }
    let best = cards[0], bs = -Infinity;
    for (const c of cards) { const s = this.botScore(p, c, diff); if (s > bs) { bs = s; best = c; } }
    this.doPlay(p, best, best.color === 'W' ? this.botColor(p, best, diff) : null, now);
  }
  botScore(p, c, diff) {
    let s = Math.random() * (diff === 'easy' ? 3 : 0.5);
    if (diff === 'easy') return s;
    const threat = this.players[this.nextIndex()].hand.length <= 2, v = c.value;
    if (c.color === 'W') { s -= 4; if (p.hand.length <= 2) s += 6; if (threat && v === 'wild4') s += 8; }
    else if (v === 'skip' || v === 'reverse' || v === 'draw2') s += threat ? 3 : 1.5;
    else s += +v * 0.1;
    if (diff === 'hard') s += 0.4 * p.hand.filter(x => x.color === c.color && x !== c).length;
    return s;
  }
  botColor(p, c, diff) {
    const cols = ['R', 'B', 'G', 'Y'];
    if (diff === 'easy') return cols[Math.floor(Math.random() * 4)];
    const cnt = { R: 0, B: 0, G: 0, Y: 0 };
    p.hand.forEach(x => { if (x !== c && cnt[x.color] !== undefined) cnt[x.color]++; });
    const top = Math.max(...Object.values(cnt)), best = cols.filter(k => cnt[k] === top);
    return best[Math.floor(Math.random() * best.length)];
  }

  endRound(winner, now) {
    const pts = this.players.filter(x => x !== winner).reduce((s, x) => s + lHandPoints(x.hand), 0);
    this.scores[winner.id] += pts;
    const over = this.scores[winner.id] >= this.target;
    this.status = over ? 'match_over' : 'round_over';
    this.deadline = null; this.botAt = null; this.uno = null; this.drawn = null; this.pending = 0; this.pendingKind = null;
    this.result = {
      winner: winner.id, winner_name: winner.name, points: pts, match_over: over, match_winner: over ? winner.id : null, target: this.target,
      players: this.players.map(x => ({ id: x.id, name: x.name, photo: x.photo, bot: x.bot, cards: x.hand.length, hand_points: lHandPoints(x.hand), score: this.scores[x.id] })),
    };
    this.ev('round_end', { winner: winner.id, points: pts, match_over: over });
  }

  tick(now) {
    if (this.status !== 'playing') return false;
    let ch = false;
    const cur = this.cur();
    if (cur.bot) { if (this.botAt === null) this.botAt = now + 1; else if (now >= this.botAt) { this.botMove(now); ch = true; } }
    else if (this.deadline !== null && now >= this.deadline) { this.timeoutAction(now); ch = true; }
    const u = this.uno;
    if (u && this.status === 'playing') {
      if (now > u.until) { this.uno = null; ch = true; }
      else if (u.catcher && now >= u.catch_at) { const c = u.catcher; u.catcher = null; try { this.catchUno(c, u.pid, now); ch = true; } catch (e) { /* окно уже закрыто */ } }
    }
    return ch;
  }

  /* Представление в том же формате, что отдаёт сервер, — клиент рисует его тем же кодом. */
  view(now) {
    const playing = this.status === 'playing', me = 'me', my = this.get(me);
    const myTurn = playing && this.cur().id === me, u = this.uno;
    const hand = my.hand.slice().sort((a, b) => (L_COLOR_ORDER[a.color] - L_COLOR_ORDER[b.color]) || (L_VALUE_ORDER[a.value] - L_VALUE_ORDER[b.value]) || (a.id - b.id));
    return {
      code: 'OFFLINE', offline: true, name: 'Игра против ботов', owner: me, public: false, has_password: false, max_players: this.players.length,
      allow_bots: true, target_score: this.target, stacking: this.stacking, turn_time: this.turnTime, status: this.status, round_no: this.round_no, ranked: false,
      players: this.players.map(p => ({ id: p.id, name: p.name, photo: p.photo, bot: p.bot, difficulty: p.difficulty, connected: true, auto: false, cards: p.hand.length, score: this.scores[p.id], uno: !!(p.uno_called && p.hand.length === 1), owner: p.id === me })),
      you: me, server_time: now, events: this.events.slice(),
      game: {
        top: this.discard[this.discard.length - 1], color: this.color, direction: this.direction, turn: playing ? this.cur().id : null, deck: this.deck.length,
        pending: this.pending, pending_kind: this.pendingKind, turn_deadline: playing ? this.deadline : null,
        uno: u && playing ? { pid: u.pid, until: u.until } : null, hand, playable: this.playableIds(me),
        can_draw: myTurn && this.drawn === null, can_pass: myTurn && this.drawn !== null, drawn: myTurn ? this.drawn : null, result: this.result,
      },
    };
  }
}

/* Контроллер офлайн-игры: подключает движок к тому же интерфейсу, что и онлайн-комнаты. */
const Local = {
  active: false, g: null, timer: null,
  start(opts) {
    this.stop();
    const tu = tg && tg.initDataUnsafe && tg.initDataUnsafe.user;
    const name = (S.user && S.user.name) || (tu && tu.first_name) || 'Вы';
    this.g = new LocalGame({ ...opts, name, photo: S.user && S.user.photo });
    this.active = true; S.lastRoom = null; S.room = null;
    this.g.startSeries(Date.now() / 1000);
    this.commit();
    this.timer = setInterval(() => this.tick(), 300);
  },
  stop() { clearInterval(this.timer); this.timer = null; this.active = false; this.g = null; },
  commit() { const v = this.g.view(Date.now() / 1000); this.g.events = []; applyRoom(v, true); },
  tick() { if (this.g && this.g.tick(Date.now() / 1000)) this.commit(); },
  exit() {
    this.stop(); S.room = null; S.lastRoom = null; ui.selected = null; closeSheet();
    if (tg) { try { tg.disableClosingConfirmation(); } catch (e) {} }
    S.screen = 'menu'; render();
  },
  request(type, d) {
    const g = this.g, t = Date.now() / 1000;
    if (!g) return { ok: false, message: 'Игра не запущена' };
    try {
      switch (type) {
        case 'play_card': g.play('me', d.card_id, d.color, t, d.double); break;
        case 'draw_card': g.draw('me', t); break;
        case 'pass_turn': g.pass('me', t); break;
        case 'call_uno': g.callUno('me'); break;
        case 'catch_uno': g.catchUno('me', d.target, t); break;
        case 'next_round': g.nextRound(t); break;
        case 'leave_room': case 'return_to_lobby': case 'close_room': this.exit(); return { ok: true };
        default: return { ok: false, message: 'В офлайн-режиме это недоступно' };
      }
    } catch (e) {
      if (e instanceof LErr) return { ok: false, code: e.code, message: e.message };
      console.error(e); return { ok: false, message: 'Внутренняя ошибка' };
    }
    this.commit();
    return { ok: true };
  },
};

/* ========================= сеть ========================= */
function wsUrl() {
  if (CONFIG.SERVER_URL) return CONFIG.SERVER_URL.replace(/\/+$/, '').replace(/^http/, 'ws') + '/ws';
  return (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws';
}
function healthUrl() {
  if (CONFIG.SERVER_URL) return CONFIG.SERVER_URL.replace(/\/+$/, '').replace(/^ws/, 'http') + '/health';
  return location.origin + '/health';
}
function devUser() {
  if (!CONFIG.ALLOW_DEV) return null;
  const p = new URLSearchParams(location.search), id = parseInt(p.get('dev') || '', 10);
  return id > 0 ? { id, name: (p.get('name') || ('Игрок ' + id)).slice(0, 24) } : null;
}

const Net = {
  ws: null, attempt: 0, retryTimer: null, pingTimer: null, pending: new Map(), stopped: false, seq: 0, everAuthed: false,
  connect() {
    if (this.ws && this.ws.readyState <= 1) return;
    let ws;
    try { ws = new WebSocket(wsUrl()); } catch (e) { this.scheduleRetry(); return; }
    this.ws = ws;
    ws.onopen = () => {
      this.sendRaw({ type: 'auth', init_data: (tg && tg.initData) || undefined, dev_user: devUser() || undefined });
      clearInterval(this.pingTimer);
      this.pingTimer = setInterval(() => this.sendRaw({ type: 'ping' }), 20000);
    };
    ws.onmessage = ev => { let m; try { m = JSON.parse(ev.data); } catch (e) { return; } handleMsg(m); };
    ws.onclose = ev => {
      if (this.ws !== ws) return;
      this.ws = null; clearInterval(this.pingTimer); this.failPending(); S.authed = false;
      if (!S.room && !Local.active && S.screen === 'menu') render();
      if (this.stopped) return;
      if (ev.code === 4003) return this.fatal('🚫', 'Сервер не принимает подключения с этой страницы. Администратору: проверьте ALLOWED_ORIGINS.');
      if (ev.code === 4002) return;
      this.scheduleRetry();
    };
    ws.onerror = () => {};
  },
  scheduleRetry() {
    clearTimeout(this.retryTimer);
    this.attempt++;
    if (!this.everAuthed && this.attempt > 5) {
      return this.fatal('📡', 'Не удалось подключиться к серверу. Проверьте интернет и попробуйте ещё раз.', true);
    }
    // оверлей «Соединение потеряно» нужен только когда игрок сидит в онлайн-комнате или идёт первый вход
    if (S.room || (!this.everAuthed && S.screen === 'loading')) showConn(this.everAuthed ? 'Соединение потеряно' : 'Подключаемся…', 'Переподключение, попытка ' + this.attempt + '…');
    else if (S.screen === 'menu') render();
    this.retryTimer = setTimeout(() => this.connect(), Math.min(800 * Math.pow(1.6, this.attempt - 1), 8000));
  },
  fatal(emoji, msg, canRetry) {
    this.stopped = true; hideConn();
    S.screen = 'error'; S.errorEmoji = emoji; S.errorMsg = msg;
    S.retry = canRetry ? () => { this.stopped = false; this.attempt = 0; boot(); } : null;
    render();
  },
  sendRaw(o) { if (this.ws && this.ws.readyState === 1) { this.ws.send(JSON.stringify(o)); return true; } return false; },
  request(type, data) {
    return new Promise(resolve => {
      const id = 'r' + (++this.seq) + Math.random().toString(36).slice(2, 8);
      if (!this.sendRaw({ type, req_id: id, ...data })) return resolve({ ok: false, message: 'Нет соединения с сервером' });
      const t = setTimeout(() => { this.pending.delete(id); resolve({ ok: false, message: 'Сервер не отвечает' }); }, 8000);
      this.pending.set(id, r => { clearTimeout(t); resolve(r); });
    });
  },
  failPending() { for (const f of this.pending.values()) f({ ok: false, message: 'Соединение потеряно' }); this.pending.clear(); },
};

async function act(type, data = {}, quiet = false) {
  if (ui.busy) return { ok: false, busy: true };
  ui.busy = true; document.body.classList.add('busy');
  try {
    const r = Local.active ? Local.request(type, data) : await Net.request(type, data);
    if (!r.ok && !quiet) { toast(r.message || 'Ошибка', 'err'); Snd.play('error'); vib('error'); }
    return r;
  } finally { ui.busy = false; document.body.classList.remove('busy'); }
}

function handleMsg(m) {
  // пока идёт офлайн-партия, сообщения о комнатах с сервера не должны её перебивать
  if (Local.active && (m.type === 'room_state' || m.type === 'left_room')) return;
  switch (m.type) {
    case 'ack': case 'error': {
      const f = m.req_id && Net.pending.get(m.req_id);
      if (f) { Net.pending.delete(m.req_id); f({ ok: m.type === 'ack', code: m.code, message: m.message }); }
      else if (m.type === 'error' && m.message) toast(m.message, 'err');
      break;
    }
    case 'auth_ok': onAuth(m); break;
    case 'auth_error': Net.stopped = true; Net.fatal('🔒', m.message || 'Ошибка авторизации'); break;
    case 'replaced': Net.stopped = true; Net.fatal('📱', 'Игра открыта в другом окне. Закройте его или перезапустите приложение.', true); break;
    case 'room_state': onRoomState(m.room); break;
    case 'left_room': onLeft(m.reason); break;
    case 'rooms': S.rooms = m.rooms || []; if ($('#rooms-list')) fillRooms(); break;
    case 'profile': S.profile = m.profile; if (!S.room) render(); break;
    case 'stats': S.stats = m; S.profile = m.profile; if (S.screen === 'stats' && !S.room) render(); break;
    case 'quick_none':
      confirmDialog('Свободных публичных комнат нет. Создать новую?', 'Создать', () => openCreate(true)); break;
    case 'pong': break;
  }
}

function onAuth(m) {
  Net.attempt = 0; Net.everAuthed = true; S.authed = true; hideConn();
  S.user = m.user; S.profile = m.profile; S.config = m.config || {};
  S.offset = m.server_time - Date.now() / 1000;
  if (Local.active) return; // идёт офлайн-партия: онлайн-состояние подтянется после выхода в меню
  if (m.room) { S.screen = 'menu'; applyRoom(m.room, false); }
  else {
    S.room = null; S.screen = 'menu'; render();
    if (S.startParam) { const c = S.startParam; S.startParam = null; openJoin(c); }
  }
}

/* ========================= применение состояния комнаты ========================= */
function nameOf(pid) { const p = S.room && S.room.players.find(x => x.id === pid); return p ? p.name : 'Игрок'; }
function onRoomState(room) { applyRoom(room, true); }

function applyRoom(room, live) {
  S.offset = room.server_time - Date.now() / 1000;
  if (S.lastRoom !== room.code) { S.lastEid = 0; S.lastRoom = room.code; ui.prevHand = null; ui.selected = null; }
  if (!S.room) closeSheet();
  const prev = S.room;
  const evs = (room.events || []).filter(e => e.eid > S.lastEid);
  evs.forEach(e => { S.lastEid = Math.max(S.lastEid, e.eid); });
  // координаты «откуда летит карта» нужно снять до перерисовки
  const from = {};
  if (live) for (const e of evs) {
    if (e.t === 'play') {
      const mine = e.pid === room.you;
      const el = mine ? document.querySelector(`.hand [data-cid="${e.card.id}"]`) : document.querySelector(`[data-ring="${e.pid}"]`);
      if (el) from[e.eid] = { rect: el.getBoundingClientRect(), mine };
    }
  }
  const prevTop = prev && prev.game ? prev.game.top : null;
  if (evs.some(e => e.t === 'deal')) { ui.dealAnim = true; ui.prevHand = null; }
  S.room = room;
  if (prev && prev.status === 'playing' && prev.game && room.game && prev.game.turn !== room.you && room.game.turn === room.you && room.status === 'playing') {
    Snd.play('turn'); vib('light');
  }
  if (live) for (const e of evs) if (e.t === 'play' && !Settings.lite) { ui.pileTopPrev = prevTop; ui.pileHold = performance.now() + 560; setTimeout(() => { ui.land = 1; render(); }, 580); }
  if (tg) { try { room.status === 'playing' ? tg.enableClosingConfirmation() : tg.disableClosingConfirmation(); } catch (e) {} }
  render();
  if (live) runEffects(evs, from);
  ui.dealAnim = false;
}

function onLeft(reason) {
  S.room = null; S.lastRoom = null; ui.selected = null; closeSheet();
  const msg = { kicked: 'Владелец исключил вас из комнаты', closed: 'Комната закрыта', idle: 'Комната закрыта из-за бездействия' }[reason];
  if (msg) toast(msg, 'err');
  if (tg) { try { tg.disableClosingConfirmation(); } catch (e) {} }
  S.screen = 'menu'; render();
}

/* ========================= эффекты, анимации ========================= */
function rectCenter(r, w) { const hgt = w * 1.5; return { left: r.left + r.width / 2 - w / 2, top: r.top + r.height / 2 - hgt / 2, width: w, height: hgt }; }
function tgtRect(el) { const r = el.getBoundingClientRect(); return rectCenter(r, el.offsetWidth || r.width); }
function fly(from, to, opt = {}) {
  if (Settings.lite || !from || !to || !document.body.animate) return;
  const dur = opt.dur || 520, delay = opt.delay || 0;
  const el = opt.card ? cardEl(opt.card) : cardEl(null, true);
  el.classList.add('flying');
  el.style.cssText = `--cw:${from.width}px;left:${from.left}px;top:${from.top}px;margin:0;z-index:60`;
  $('#fx').append(el);
  const dx = (to.left + to.width / 2) - (from.left + from.width / 2), dy = (to.top + to.height / 2) - (from.top + from.height / 2);
  const s = to.width / from.width, rot = opt.rot == null ? (dx >= 0 ? 1 : -1) * (6 + Math.random() * 8) : opt.rot, arc = Math.min(60, Math.hypot(dx, dy) * .18);
  const a = el.animate([
    { transform: 'translate3d(0,0,0) scale(1) rotate(0deg)', offset: 0 },
    { transform: `translate3d(${dx / 2}px,${dy / 2 - arc}px,0) scale(${(1 + s) / 2 * 1.08}) rotate(${rot}deg)`, offset: .5 },
    { transform: `translate3d(${dx}px,${dy}px,0) scale(${s}) rotate(0deg)`, offset: 1 }],
    { duration: dur, delay, easing: 'cubic-bezier(.3,.7,.3,1)', fill: 'both' });
  a.onfinish = () => { el.remove(); if (opt.onEnd) opt.onEnd(); };
}
function clearDeal() { ui.dealHide = null; clearTimeout(ui.dealTm); document.querySelectorAll('.dw').forEach(e => e.classList.remove('dw')); }
function dealAnimation() {
  const R = S.room, hide = ui.dealHide;
  const deckEl = $('.deck .card'), pileEl = $('.pile .card');
  if (!R || !hide || Settings.lite || !deckEl || !pileEl) { clearDeal(); return; }
  const dr = deckEl.getBoundingClientRect(), cw = dr.width, cards = [...document.querySelectorAll('.hand .card')];
  const i0 = R.players.findIndex(p => p.id === R.you), order = [...R.players.slice(i0), ...R.players.slice(0, i0)];
  const per = Math.max(cards.length, 7), gap = order.length > 3 ? 55 : 75;
  const deck = $('.deck'); if (deck) { deck.classList.add('shuf'); setTimeout(() => deck.classList.remove('shuf'), 520); }
  Snd.play('deal'); let t = 520, k = 0;
  for (let r = 0; r < per; r++) for (const p of order) {
    let to, onEnd;
    if (p.id === R.you) { const c = cards[r]; if (!c) continue; to = tgtRect(c); onEnd = () => { hide.delete(c.dataset.cid); c.classList.remove('dw'); c.classList.add('flipin'); }; }
    else {
      if (r >= p.cards) continue;
      const av = document.querySelector(`[data-ring="${p.id}"]`); if (!av) continue;
      to = rectCenter(av.getBoundingClientRect(), cw * .5);
      onEnd = () => { av.classList.remove('bump'); void av.offsetWidth; av.classList.add('bump'); };
    }
    fly(dr, to, { delay: t, dur: 430, onEnd });
    if (k++ % 2 === 0) setTimeout(() => Snd.tone(700 + Math.random() * 300, .035, 'triangle', .05), t + 380);
    t += gap;
  }
  const col = COLOR_HEX[R.game.color] || '#ffd75a';
  fly(dr, tgtRect(pileEl), { delay: t + 120, dur: 520, rot: -8, onEnd: () => {

}

function layoutHand() {
  const sc = $('.hand-scroll'); if (!sc) return;
  const hand = $('.hand', sc), cards = [...hand.children]; if (!cards.length) return;
  const n = cards.length, cw = cards[0].offsetWidth || 60, W = sc.clientWidth - 16;
  let step = n > 1 ? Math.min(cw * 0.9, (W - cw) / (n - 1)) : 0, scrolls = false;
  const MIN = Math.max(26, cw * 0.42);
  if (n > 1 && step < MIN) { step = MIN; scrolls = true; }
  ui.overlapping = n > 1 && step < cw * 0.7;
  const mid = (n - 1) / 2, ang = Math.min(4.5, 26 / n), fan = !scrolls && n > 2 && !Settings.lite;
  cards.forEach((c, i) => {
    c.style.marginLeft = i === 0 ? '0' : `${step - cw}px`;
    if (fan) { const k = i - mid; c.style.rotate = (k * ang).toFixed(1) + 'deg'; c.style.translate = '0 ' + (k * k * Math.min(1.2, 5 / n)).toFixed(1) + 'px'; }
    else { c.style.rotate = ''; c.style.translate = ''; }
  });
  hand.style.width = (cw + step * (n - 1)) + 'px';
  hand.style.margin = scrolls ? '0' : '0 auto';
  sc.style.overflowX = scrolls ? 'auto' : 'hidden';
}
window.addEventListener('resize', () => { layoutHand(); });

function onCardTap(c, el) {
  const R = S.room; if (!R || R.status !== 'playing') return;

    Snd.play('error'); vib('error');
    if (G.pending) toast('Добавьте «+2» того же цвета, «+4» или возьмите штраф');
    else if (c.value === 'wild4') toast('«+4» можно сыграть, только если нет карты текущего цвета');
    else toast('Эту карту нельзя сыграть');

  }
  if (ui.overlapping && ui.selected !== c.id) { ui.selected = c.id; Snd.play('click'); render(); return; }

function updateTimers() {

  document.querySelectorAll('[data-ring]').forEach(el => {
    let p = 0, urgent = false;
    if (live && G.turn_deadline && el.dataset.ring === G.turn) {
      const rem = Math.max(0, G.turn_deadline - t); p = Math.min(100, rem / R.turn_time * 100); urgent = rem <= 8;
    }
    el.style.setProperty('--p', p.toFixed(1)); el.classList.toggle('urgent', urgent);
  });
  const tb = $('#tbar'), tl = $('#tleft');
  if (tb && tl) {
    if (live && G.turn === R.you && G.turn_deadline) {
      const rem = Math.max(0, G.turn_deadline - t);
      tb.style.setProperty('--p', Math.min(100, rem / R.turn_time * 100).toFixed(1)); tb.classList.toggle('urgent', rem <= 8); tl.textContent = Math.ceil(rem) + ' с';
    } else { tb.style.setProperty('--p', 0); tl.textContent = ''; }
  }
  document.querySelectorAll('[data-catch]').forEach(el => { el.hidden = !(live && G.uno && t < G.uno.until && G.uno.pid === el.dataset.catch); });

/* ========================= запуск ========================= */
async function checkServer() {
  for (let i = 0; i < 10; i++) {
    if (S.abortBoot) return false;
    try {
      const ctl = new AbortController(), tm = setTimeout(() => ctl.abort(), 5000);
      await fetch(healthUrl(), { cache: 'no-store', mode: 'no-cors', signal: ctl.signal });
      clearTimeout(tm); return true;
    } catch (e) {}
    if (S.abortBoot) return false;
    S.loadingMsg = i < 1 ? 'Проверяем сервер…' : `Сервер просыпается… (${i + 1}/10)`; if (S.screen === 'loading') render();
    await sleep(3000);
  }
  return false;
}

    setTimeout(() => {

  if (!(tg && tg.initData) && !devUser()) return offlineMenu('Откройте игру через Telegram, чтобы играть с друзьями онлайн.');
  if (!(await checkServer())) return offlineMenu('Сервер недоступен или ещё запускается. Офлайн-режим работает.');
  if (S.abortBoot) return;
  S.loadingMsg = 'Подключаемся…'; render();
  Net.stopped = false; Net.attempt = 0; Net.connect();
}
